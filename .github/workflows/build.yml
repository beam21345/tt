name: Build Alastor Staff jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Forge 1.20.1 MDK with this mod's sources
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          MDK_DIR=$(dirname "$(find mdk -name gradlew | head -1)")
          rm -rf "$MDK_DIR/src"
          cp -r src "$MDK_DIR/src"
          cp gradle.properties "$MDK_DIR/gradle.properties"
          cat >> "$MDK_DIR/build.gradle" <<'GRADLE'

          repositories {
              maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
              maven { url 'https://maven.kosmx.dev/' }
          }
          dependencies {
              implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9")
              implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20")
          }
          GRADLE
          echo "MDK_DIR=$MDK_DIR" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          cd "$MDK_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: AlastorStaff-jar
          path: ${{ env.MDK_DIR }}/build/libs/*.jar
